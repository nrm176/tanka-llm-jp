[project]
name = "tanka-backend"
version = "0.1.0"
description = "Tanka generation backend (FastAPI + LM Studio)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.0",
    "pykakasi>=2.3.0",
    "pymongo>=4.10",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
